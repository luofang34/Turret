# Turret Daemon Configuration
#
# This file configures the Turret gimbal manager when running in daemon mode.
# To use: turret --daemon --config turret.toml

# Device configuration.
[device]
# Serial device path.
# Use "auto" for automatic detection, or specify a path like "/dev/ttyACM0".
path = "auto"

# Unix socket IPC configuration.
[ipc]
# Path to Unix domain socket for local IPC.
# Other processes can connect to this socket to control the gimbal.
socket_path = "/tmp/turret.sock"

# MAVLink configuration.
[mavlink]
# Enable MAVLink Gimbal Manager protocol.
enabled = true

# Transport type. Currently only "udp" is implemented.
transport = "udp"

# Local interface to bind. Default 127.0.0.1 (loopback only) —
# safe for embedded products where MAVLink shouldn't be exposed to
# the LAN by default. Set to 0.0.0.0 (or a specific interface
# address) for companion-on-network setups where the autopilot or
# GCS is on a different host.
bind_addr = "0.0.0.0"

# UDP port for MAVLink. Default: 14550 (standard MAVLink port).
udp_port = 14550

# MAVLink system ID (1 = autopilot, 2+ = companion computer).
sysid = 1

# MAVLink component ID (154 = MAV_COMP_ID_GIMBAL).
compid = 154

# Gimbal-physical / calibration tuning.
[gimbal]
# Continuous yaw drift corrector ("self-erecting gyro"). Default: true.
# Once the gimbal has been settled at the most-recent SP for ≥ 2 s the
# corrector treats the operator-frame `PV - SP` gap as drift and nudges
# the calibration offset to close it. Disable for actively-yawing
# flight with pan-mode PAN, where the "gimbal at rest in the world
# between SETs" assumption breaks down.
yaw_corrector_enabled = true

# Logging: configure via the CLI's -v / -vv / -vvv flag and/or the
# RUST_LOG environment variable. There is no logging section here —
# tracing is initialized before the daemon reads this file, so a TOML
# knob would silently do nothing.
