name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel older runs on the same branch when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.gate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate: [fmt, clippy, test, doc, release-build, lib-no-default, publish-dryrun]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # serialport → libudev-sys needs pkg-config + libudev headers.
      # Wrap apt in a retry loop because the GitHub-Actions Ubuntu runners
      # periodically can't reach `azure.archive.ubuntu.com` (DNS / mirror
      # outages lasting tens of minutes). Five attempts with exponential
      # backoff give up to ~15 min total wait, longer than typical
      # transient outages but well inside the GA-hosted-runner job limit.
      - name: Install libudev
        if: matrix.gate != 'fmt'
        run: |
          set +e
          for attempt in 1 2 3 4 5; do
            sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev
            result=$?
            if [ $result -eq 0 ]; then
              echo "apt install succeeded on attempt ${attempt}"
              exit 0
            fi
            sleep_for=$((attempt * 60))
            echo "apt install failed on attempt ${attempt} (exit ${result}); sleeping ${sleep_for}s"
            sleep ${sleep_for}
          done
          echo "apt install failed after 5 attempts — Azure mirror likely down for an extended outage"
          exit 1

      - uses: Swatinem/rust-cache@v2
        if: matrix.gate != 'fmt'

      - name: fmt check
        if: matrix.gate == 'fmt'
        run: cargo fmt --all -- --check

      - name: clippy
        if: matrix.gate == 'clippy'
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

      - name: test
        if: matrix.gate == 'test'
        run: cargo test --workspace --locked --all-targets

      - name: doc
        if: matrix.gate == 'doc'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --locked --no-deps

      - name: release build
        if: matrix.gate == 'release-build'
        run: cargo build --workspace --locked --release

      # Library-only build with default features off — proves a downstream
      # consumer that wants just the Storm32 driver can `cargo add turret`
      # with `default-features = false` and skip the daemon / CLI deps.
      - name: lib-no-default (clippy + doc)
        if: matrix.gate == 'lib-no-default'
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo clippy --locked --no-default-features --lib -- -D warnings
          cargo doc --locked --no-default-features --no-deps

      # `cargo publish --dry-run` validates Cargo.toml metadata, packages
      # the crate as a tarball, and rebuilds it from the tarball — catching
      # missing `package.exclude` entries, broken doctest imports under the
      # tarball file set, or stale `description / license / repository`
      # fields BEFORE a real release. The "already exists on crates.io"
      # warning is expected until the version is bumped; it doesn't fail
      # the gate.
      - name: publish dry-run
        if: matrix.gate == 'publish-dryrun'
        run: cargo publish --workspace --dry-run --locked
