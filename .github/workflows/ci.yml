name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel older runs on the same branch when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.gate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate: [fmt, clippy, test, doc, release-build, lib-no-default]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # serialport → libudev-sys needs pkg-config + libudev headers.
      - name: Install libudev
        if: matrix.gate != 'fmt'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev

      - uses: Swatinem/rust-cache@v2
        if: matrix.gate != 'fmt'

      - name: fmt check
        if: matrix.gate == 'fmt'
        run: cargo fmt --all -- --check

      - name: clippy
        if: matrix.gate == 'clippy'
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: test
        if: matrix.gate == 'test'
        run: cargo test --locked --all-targets

      - name: doc
        if: matrix.gate == 'doc'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps

      - name: release build
        if: matrix.gate == 'release-build'
        run: cargo build --locked --release

      # Library-only build with default features off — proves a downstream
      # consumer that wants just the Storm32 driver can `cargo add turret`
      # with `default-features = false` and skip the daemon / CLI deps.
      - name: lib-no-default (clippy + doc)
        if: matrix.gate == 'lib-no-default'
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo clippy --locked --no-default-features --lib -- -D warnings
          cargo doc --locked --no-default-features --no-deps
