[package]
name = "turret"
version = "0.1.1"
edition = "2021"
authors = ["luofang@luofang.org"]
description = "Command-line tool for controlling STorM32 turret controllers via RC Commands protocol"
license = "GPL-3.0"
repository = "https://github.com/luofang34/turret"
homepage = "https://github.com/luofang34/turret"
documentation = "https://docs.rs/turret"
readme = "README.md"
keywords = ["turret", "gimbal", "storm32", "serial", "bgc"]
categories = ["command-line-utilities", "hardware-support"]
rust-version = "1.70"

[dependencies]
serialport = "4.5"
anyhow = "1.0"
thiserror = "2.0"
clap = { version = "4.0", features = ["derive"] }
log = "0.4"
env_logger = "0.10"
tokio = { version = "1.42", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
mavlink = "0.13"

[[bin]]
name = "turret"
path = "src/main.rs"

[profile.release]
opt-level = 'z'       # Optimize for size
lto = true            # Link-time optimization
codegen-units = 1     # Better optimization
panic = 'abort'       # Smaller panic handler
strip = true          # Remove debug symbols
