[package]
name = "gimbal"
version = "0.1.0"
edition = "2021"
authors = ["luofang@luofang.org"]
description = "Command-line tool for controlling STorM32 gimbal controllers via RC Commands protocol"
license = "GPL-3.0"
repository = "https://github.com/luofang34/gimbal"
homepage = "https://github.com/luofang34/gimbal"
documentation = "https://docs.rs/gimbal"
readme = "README.md"
keywords = ["gimbal", "storm32", "rc-commands", "serial", "bgc"]
categories = ["command-line-utilities", "hardware-support"]
rust-version = "1.70"

[dependencies]
serialport = "4.5"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
log = "0.4"
env_logger = "0.10"

[[bin]]
name = "gimbal"
path = "src/main.rs"
