[package]
name = "turret"
version = "0.1.2"
edition = "2021"
authors = ["luofang@luofang.org"]
description = "MAVLink Gimbal Manager and CLI for STorM32 RC Commands gimbals"
license = "GPL-3.0"
repository = "https://github.com/luofang34/turret"
homepage = "https://github.com/luofang34/turret"
documentation = "https://docs.rs/turret"
readme = "README.md"
keywords = ["turret", "gimbal", "storm32", "mavlink", "serial"]
categories = ["command-line-utilities", "hardware-support"]
# 1.83 is the floor for `std::io::ErrorKind::ResourceBusy` (used in
# `detect_gimbal` to distinguish EBUSY from "no device found"). The
# earlier 1.74 floor was driven by the `[lints]` tables below; both
# are still required.
rust-version = "1.83"
# Dev artifacts that have no business shipping in the crates.io tarball.
# Source files that ARE compiled live under src/ and are included by default;
# this list only filters auxiliary docs / scripts at the repo root.
exclude = [
    "test_daemon.sh",
    "systemd/**",
    ".github/**",
]

[features]
# What ships by default — preserves the current binary behavior.
default = ["cli", "daemon"]

# Enables the daemon: tokio runtime, IPC over Unix sockets, MAVLink
# Gimbal Manager, daemon::config / state / arbitrator. A library consumer
# that only wants the Storm32 driver can disable this.
daemon = [
    "dep:tokio",
    "dep:parking_lot",
    "dep:serde_json",
    "dep:serde_yaml_ng",
    "dep:toml",
    "dep:mavlink",
]

# Enables the CLI binary's runtime needs (clap arg parser, tracing
# subscriber). The bin target itself is only built when both `cli`
# and `daemon` are enabled. Errors propagate as `turret::Error`; no
# anyhow dependency in the package at all.
cli = ["dep:clap", "dep:tracing-subscriber"]

[dependencies]
# Library core — always on.
serialport = "4.9"
thiserror = "2.0"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }

# CLI-only.
clap = { version = "4.6", features = ["derive"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

# Daemon-only.
# `default-features = false` + the explicit feature set drops the
# multi-thread runtime, fs, process, parking_lot integration and a
# couple of other pieces we don't use. Keeps memory tight on small
# boards: -396 KB RSS, -6 worker threads on Jetson Orin (8-core),
# vs the `features = ["full"]` baseline.
tokio = { version = "1.52", default-features = false, features = ["rt", "macros", "io-util", "net", "signal", "sync", "time"], optional = true }
parking_lot = { version = "0.12", optional = true }
serde_json = { version = "1.0", optional = true }
serde_yaml_ng = { version = "0.10", optional = true }
mavlink = { version = "0.17", optional = true }
toml = { version = "1.1", optional = true, default-features = false, features = ["parse", "display", "serde"] }

[[bin]]
name = "turret"
path = "src/main.rs"
required-features = ["cli", "daemon"]

# End-to-end smoke for the MAVLink inbound path + attitude broadcast.
# Skipped automatically when the `daemon` feature is off (e.g. lean-lib
# CI gate).
[[test]]
name = "mavlink_smoke"
required-features = ["daemon"]

# Library-wide lint floor. See `clippy.toml` for the configuration list
# that backs `disallowed_types`. `forbid` is used wherever no exception
# exists in the entire package (lib + bin + tests); inner attributes
# can't override `forbid`. `unwrap_used` / `expect_used` / `panic` stay
# at `deny` because each `mod tests` block explicitly opts out.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
disallowed_types = "forbid"
await_holding_lock = "forbid"
let_underscore_must_use = "forbid"
let_underscore_future = "forbid"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
opt-level = 'z'       # Optimize for size
lto = true            # Link-time optimization
codegen-units = 1     # Better optimization
panic = 'abort'       # Smaller panic handler
strip = true          # Remove debug symbols
