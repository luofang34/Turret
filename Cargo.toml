[package]
name = "turret"
version = "0.1.1"
edition = "2021"
authors = ["luofang@luofang.org"]
description = "MAVLink Gimbal Manager and CLI for STorM32 RC Commands gimbals"
license = "GPL-3.0"
repository = "https://github.com/luofang34/turret"
homepage = "https://github.com/luofang34/turret"
documentation = "https://docs.rs/turret"
readme = "README.md"
keywords = ["turret", "gimbal", "storm32", "mavlink", "serial"]
categories = ["command-line-utilities", "hardware-support"]
# 1.74 is the floor for `[lints]` tables in Cargo.toml. Without this,
# the lints below silently fall back to the lib.rs `#![deny()]` block,
# which doesn't propagate to consumers using `cargo metadata`.
rust-version = "1.74"
# Dev artifacts that have no business shipping in the crates.io tarball.
# Source files that ARE compiled live under src/ and are included by default;
# this list only filters auxiliary docs / scripts at the repo root.
exclude = [
    "REFACTORING_PLAN.md",
    "test_daemon.sh",
    "systemd/**",
    ".github/**",
]

[features]
# What ships by default — preserves the current binary behavior.
default = ["cli", "daemon"]

# Enables the daemon: tokio runtime, IPC over Unix sockets, MAVLink
# Gimbal Manager, daemon::config / state / arbitrator. A library consumer
# that only wants the Storm32 driver can disable this.
daemon = [
    "dep:tokio",
    "dep:parking_lot",
    "dep:serde_json",
    "dep:serde_yaml",
    "dep:mavlink",
]

# Enables the CLI binary's runtime needs (clap arg parser, env_logger
# subscriber, anyhow at the main boundary). The bin target itself is
# only built when both `cli` and `daemon` are enabled.
cli = ["dep:clap", "dep:tracing-subscriber", "dep:anyhow"]

[dependencies]
# Library core — always on.
serialport = "4.5"
thiserror = "2.0"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }

# CLI-only.
clap = { version = "4.0", features = ["derive"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
anyhow = { version = "1.0", optional = true }

# Daemon-only.
tokio = { version = "1.42", features = ["full"], optional = true }
parking_lot = { version = "0.12", optional = true }
serde_json = { version = "1.0", optional = true }
serde_yaml = { version = "0.9", optional = true }
mavlink = { version = "0.13", optional = true }

[[bin]]
name = "turret"
path = "src/main.rs"
required-features = ["cli", "daemon"]

# Library-wide lint floor. See `clippy.toml` for the configuration list
# that backs `disallowed_types`. `forbid` for unsafe means inner attributes
# can't override it; the rest are `deny` so tests can `#[allow(...)]` on a
# per-module basis.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
disallowed_types = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
await_holding_lock = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"

[profile.release]
opt-level = 'z'       # Optimize for size
lto = true            # Link-time optimization
codegen-units = 1     # Better optimization
panic = 'abort'       # Smaller panic handler
strip = true          # Remove debug symbols
